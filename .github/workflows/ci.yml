name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run migrations:test
      - name: Protect published migration history
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$MIGRATION_BASE" ] && [ "$MIGRATION_BASE" != "0000000000000000000000000000000000000000" ]; then
            node scripts/check-migrations.mjs --base "$MIGRATION_BASE"
          else
            node scripts/check-migrations.mjs
          fi
      - run: bun run roadmap:check
      - run: bun run roadmap:test
      - run: bun run build
        env:
          NITRO_PRESET: vercel
